name: dress_admin
description: Admin dashboard for the Dress rental marketplace
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  fluentui_system_icons: ^1.1.273
  supabase_flutter: ^2.5.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
